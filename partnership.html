<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10172b">
  <title>제휴 문의 | 천성원</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f7f8fc;
      background: #10172b;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 36px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(80, 107, 230, .2), transparent 42%),
        radial-gradient(ellipse at 92% 92%, rgba(139, 76, 195, .16), transparent 38%),
        #10172b;
    }

    button, input, select, textarea { font: inherit; }

    .panel {
      width: min(100%, 620px);
      padding: clamp(24px, 5vw, 44px);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 24px;
      background: rgba(25, 34, 58, .92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .3);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #aab8ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 36px);
      letter-spacing: -.04em;
    }

    .intro {
      margin: 12px 0 28px;
      color: #aab2c6;
      font-size: 15px;
      line-height: 1.7;
    }

    form, .field {
      display: grid;
      gap: 16px;
    }

    .field { gap: 7px; }

    label, legend {
      color: #e6e9f2;
      font-size: 13px;
      font-weight: 700;
    }

    .optional {
      color: #818ba2;
      font-size: 12px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 11px;
      outline: none;
      color: #f7f8fc;
      background: #222d4a;
    }

    select:invalid { color: #aab2c6; }
    select option { color: #f7f8fc; }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.6;
    }

    input::placeholder, textarea::placeholder { color: #818ba2; }

    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 3px solid #aab8ff;
      outline-offset: 2px;
    }

    fieldset {
      margin: 0;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 12px;
    }

    legend { padding: 0 5px; }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #aab2c6;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.65;
    }

    .consent input {
      width: 18px;
      min-height: 18px;
      flex: 0 0 18px;
      margin: 1px 0 0;
      accent-color: #aab8ff;
    }

    .submit {
      min-height: 50px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      color: #20243a;
      background: linear-gradient(135deg, #ffe27a, #ffc94d);
      font-weight: 800;
      cursor: pointer;
      transition: filter .18s ease, transform .18s ease;
    }

    .submit:hover { transform: translateY(-1px); filter: brightness(1.05); }

    .notice {
      margin: 16px 0 0;
      color: #818ba2;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">PARTNERSHIP</p>
    <h1>제휴 문의</h1>
    <p class="intro">부동산 중개 및 자산관리 관련 협업 제안을 남겨 주세요.<br>확인 후 입력하신 연락처로 답변드리겠습니다.</p>

    <form action="https://formspree.io/f/mqpqwdnk" method="POST">
      <input type="hidden" name="_subject" value="새로운 제휴 문의">

      <div class="field">
        <label for="name">담당자명</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="company">회사·단체명 <span class="optional">(선택)</span></label>
        <input id="company" name="company" type="text" autocomplete="organization">
      </div>

      <div class="field">
        <label for="email">회신 이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="phone">연락처 <span class="optional">(선택)</span></label>
        <input id="phone" name="phone" type="tel" autocomplete="tel">
      </div>

      <div class="field">
        <label for="topic">제휴 분야</label>
        <select id="topic" name="partnership_type" required>
          <option value="" selected disabled>분야를 선택해 주세요</option>
          <option value="real-estate">부동산 중개</option>
          <option value="asset-management">부동산 자산관리</option>
          <option value="marketing">공동 마케팅·콘텐츠</option>
          <option value="other">기타 제휴</option>
        </select>
      </div>

      <div class="field">
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" placeholder="제휴 제안과 희망하시는 협업 내용을 적어 주세요." required></textarea>
      </div>

      <fieldset>
        <legend>개인정보 수집·이용 동의 <span class="optional">(필수)</span></legend>
        <label class="consent">
          <input name="privacy_consent" type="checkbox" value="동의" required>
          <span>제휴 문의에 대한 확인 및 회신을 위해 입력한 개인정보를 수집·이용하는 데 동의합니다. 문의 내용은 Formspree를 통해 전달됩니다.</span>
        </label>
      </fieldset>

      <button class="submit" type="submit">제휴 문의 보내기</button>
    </form>

    <p class="notice">문의 내용과 연락처를 정확히 입력해 주세요. 제출 후 Formspree의 접수 안내가 표시됩니다.</p>
  </main>
</body>
</html>
